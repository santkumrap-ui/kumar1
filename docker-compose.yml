services:
  deploy-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deploydbs
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  deploy:
    image: deploy:correct
    environment:
      SERVER_PORT: 8080
      DB_HOST: deploy-mysql
      DB_PORT: 3306
      DB_NAME: deploydbs
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      deploy-mysql:
        condition: service_healthy